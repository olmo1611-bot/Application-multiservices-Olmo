<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLMO — Tout en un</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fa;
  color: #17202a;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  text-decoration: none;
  color: inherit;
}

:root {
  --primary: #111827;
  --secondary: #2563eb;
  --accent: #16a34a;
  --danger: #dc2626;
  --light: #f5f7fa;
  --white: #ffffff;
  --border: #e5e7eb;
  --text: #17202a;
  --muted: #6b7280;
}
</style>
<style>
/* ===== EN-TÊTE ===== */

header {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -1px;
}

.logo span {
  color: var(--secondary);
}

.search-box {
  flex: 1;
  max-width: 500px;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 12px 45px 12px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: #f9fafb;
}

.search-box input:focus {
  border-color: var(--secondary);
}

.search-btn {
  position: absolute;
  right: 5px;
  top: 5px;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 9px;
  background: var(--secondary);
  color: white;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 10px;
  font-size: 18px;
}

.icon-btn:hover {
  background: #f3f4f6;
}

/* ===== NAVIGATION ===== */

.main-nav {
  max-width: 1200px;
  margin: auto;
  padding: 0 20px 12px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.nav-btn {
  border: none;
  background: #f3f4f6;
  padding: 9px 15px;
  border-radius: 20px;
  white-space: nowrap;
  color: var(--text);
}

.nav-btn.active,
.nav-btn:hover {
  background: var(--primary);
  color: white;
}

/* ===== CONTENU ===== */

.container {
  max-width: 1200px;
  margin: auto;
  padding: 30px 20px 100px;
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.hero {
  background: linear-gradient(135deg, #111827, #2563eb);
  color: white;
  border-radius: 22px;
  padding: 45px 30px;
  margin-bottom: 30px;
}

.hero h1 {
  font-size: 38px;
  margin-bottom: 12px;
}

.hero p {
  color: #e5e7eb;
  max-width: 650px;
  line-height: 1.6;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 30px 0 18px;
}

.section-title h2 {
  font-size: 24px;
}

.section-title button {
  border: none;
  background: none;
  color: var(--secondary);
  font-weight: 600;
}

/* ===== CARTES ===== */

.grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}

.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.card-body {
  padding: 16px;
}

.card h3 {
  margin-bottom: 8px;
  font-size: 17px;
}

.card p {
  color: var(--muted);
  line-height: 1.5;
}

.card-image {
  height: 150px;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
}

.price {
  font-size: 19px;
  font-weight: 800;
  color: var(--primary);
  margin: 10px 0;
}

.btn {
  border: none;
  border-radius: 10px;
  padding: 11px 16px;
  font-weight: 600;
}

.btn-primary {
  background: var(--secondary);
  color: white;
}

.btn-success {
  background: var(--accent);
  color: white;
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-light {
  background: #f3f4f6;
  color: var(--text);
}

.btn-block {
  width: 100%;
}

/* ===== RESPONSIVE ===== */

@media (max-width: 800px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .header-inner {
    flex-wrap: wrap;
  }

  .search-box {
    order: 3;
    flex-basis: 100%;
    max-width: none;
  }

  .hero h1 {
    font-size: 30px;
  }
}

@media (max-width: 500px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .container {
    padding-left: 14px;
    padding-right: 14px;
  }

  .hero {
    padding: 30px 20px;
  }
}
  </style></head>
<body>
